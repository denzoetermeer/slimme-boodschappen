name: Build Slimme Boodschappen APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack Android project
        run: |
          unzip -q SlimmeBoodschappen-Android-startproject.zip -d /tmp/project
          cp -a /tmp/project/SlimmeBoodschappen/. .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Slimme-Boodschappen-APK
          path: app/build/outputs/apk/debug/app-debug.apk
