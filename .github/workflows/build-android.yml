name: Build Slimme Boodschappen APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack Android source project
        run: |
          unzip -q SlimmeBoodschappen-v0.8.0-broncode.zip -d /tmp/project
          cp -a /tmp/project/app .
          cp /tmp/project/settings.gradle.kts /tmp/project/build.gradle.kts /tmp/project/gradle.properties .
          cp /tmp/project/RELEASE_SIGNING.md .
          

      - name: Add Google code scanner dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("app/build.gradle.kts"),
              Path("app/build.gradle")
          ]
          gradle_file = next(
              (p for p in files if p.exists()), None
          )

          if gradle_file is None:
              raise SystemExit("Gradle-bestand niet gevonden")

          source = gradle_file.read_text()
          dependency = 'implementation("com.google.android.gms:play-services-code-scanner:16.1.0")'

          if dependency not in source:
              source, count = re.subn(
                  r'(?m)^dependencies\s*\{',
                  lambda m: m.group(0) + "\n    " + dependency,
                  source,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Dependencies-blok niet gevonden")
              gradle_file.write_text(source)


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing GitHub secret KEYSTORE_BASE64. See RELEASE_SIGNING.md" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SlimmeBoodschappen-v0.8.0-release
          path: app/build/outputs/apk/release/app-release.apk
